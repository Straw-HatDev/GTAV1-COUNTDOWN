<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTAVI // Chiefs Clock — Countdown to 00:00 GMT Thursday 19 November</title>
  <meta name="description" content="Chiefs Clock: Futuristic GTAVI countdown display counting down days, hours, minutes, and seconds until 00:00 GMT Thursday 19 November (midnight Wednesday night). Created by ChiefStudioLabs." />
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --vice-bg-deep: #06020f;
      --vice-bg-mid: #110524;
      --vice-bg-plum: #21073c;
      --vice-pink: #ff1e8e;
      --vice-magenta: #f72585;
      --vice-coral: #ff5e5b;
      --vice-orange: #ff8a2b;
      --vice-gold: #ffc43d;
      --vice-cyan: #00f0ff;
      --vice-teal: #00c8ff;
      --vice-violet: #9d4edd;
      --vice-white: #fff7fb;
      --vice-muted: #c9b3d9;
      --cash-green: #2ef27a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: var(--vice-bg-deep);
      color: var(--vice-white);
      font-family: 'Rajdhani', 'Orbitron', 'Eurostile', 'Impact', 'Arial Black', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      background: var(--vice-pink);
      color: #ffffff;
    }

    /* Background Interactive Synth-Horizon Canvas */
    #vice-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Subtle futuristic scanline & vignette overlay */
    .hud-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 35%, rgba(255, 30, 142, 0.14) 0%, rgba(0, 240, 255, 0.07) 45%, rgba(6, 2, 15, 0.84) 100%),
        repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.018) 0px,
          rgba(255, 255, 255, 0.018) 1px,
          transparent 1px,
          transparent 3px
        );
    }

    /* Main Wrapper */
    .vice-shell {
      position: relative;
      z-index: 2;
      max-width: 1360px;
      margin: 0 auto;
      padding: 20px 22px 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
    }

    /* =====================================================
       TOP BOX: "Chiefs Clock"
       ===================================================== */
    .top-chiefs-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px 24px;
      background: linear-gradient(90deg, rgba(255, 30, 142, 0.18), rgba(17, 5, 36, 0.9) 50%, rgba(0, 240, 255, 0.18));
      border: 1px solid rgba(255, 94, 91, 0.48);
      clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
      box-shadow: 0 0 24px rgba(255, 30, 142, 0.2), inset 0 0 18px rgba(0, 240, 255, 0.08);
    }

    .beacon-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--vice-cyan);
      box-shadow: 0 0 10px var(--vice-cyan), 0 0 20px var(--vice-cyan);
      animation: pulse-dot 1.2s infinite ease-in-out;
      flex-shrink: 0;
    }

    .chiefs-clock-title {
      font-family: 'Impact', 'Arial Black', 'Orbitron', 'Rajdhani', sans-serif;
      font-size: clamp(1.35rem, 2.8vw, 2.1rem);
      font-weight: 900;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--vice-cyan) 0%, #ffffff 35%, var(--vice-pink) 70%, var(--vice-gold) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 14px rgba(0, 240, 255, 0.45));
    }

    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.55; }
    }

    /* =====================================================
       MAIN COUNTDOWN BOX
       1. Top Row: Unified Huge GTAVI (same size/color/style) + Ticking Clock
       2. Bottom Inner Box: 4-Panel Counter (Days, Hours, Minutes, Seconds)
       ===================================================== */
    .main-countdown-deck {
      display: flex;
      flex-direction: column;
      gap: 22px;
      padding: 26px 28px 28px;
      background: linear-gradient(135deg, rgba(22, 6, 44, 0.9) 0%, rgba(10, 3, 24, 0.95) 60%, rgba(28, 8, 52, 0.9) 100%);
      border: 2px solid rgba(255, 30, 142, 0.52);
      box-shadow:
        0 26px 75px rgba(0, 0, 0, 0.85),
        0 0 55px rgba(255, 30, 142, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
      clip-path: polygon(0 0, calc(100% - 28px) 0, 100% 28px, 100% 100%, 28px 100%, 0 calc(100% - 28px));
      position: relative;
      overflow: hidden;
    }

    .main-countdown-deck::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--vice-pink), var(--vice-orange), var(--vice-gold), var(--vice-cyan));
    }

    /* Upper Row: Unified Huge GTAVI Title + Ticking Clock Beside It */
    .gtavi-and-clock-row {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 28px;
      padding: 4px 8px;
    }

    .gtavi-heading {
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      user-select: none;
      position: relative;
      margin: 0;
    }

    /* Unified GTAVI SVG where GTA and VI share the exact same height, color gradient, palm art, and neon bevel */
    .gtavi-unified-svg {
      width: clamp(310px, 56vw, 660px);
      height: auto;
      max-height: 195px;
      overflow: visible;
      filter:
        drop-shadow(0 0 18px rgba(255, 255, 255, 0.85))
        drop-shadow(0 0 40px rgba(255, 255, 255, 0.55));
    }

    /* Ticking Clock Beside GTAVI */
    .beside-ticking-clock {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    .analog-clock-box {
      position: relative;
      width: clamp(124px, 14.5vw, 162px);
      height: clamp(124px, 14.5vw, 162px);
      flex-shrink: 0;
      filter: drop-shadow(0 0 22px rgba(0, 240, 255, 0.32));
    }

    .analog-clock-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .clock-tick-pulse {
      animation: clock-flash 1s infinite;
    }

    @keyframes clock-flash {
      0% { filter: drop-shadow(0 0 10px var(--vice-cyan)); }
      30% { filter: drop-shadow(0 0 3px rgba(0, 240, 255, 0.4)); }
      100% { filter: drop-shadow(0 0 2px rgba(0, 240, 255, 0.2)); }
    }

    /* Icon-Only Audio Toggle Button: Solid Red (OFF) / Solid Green (ON) */
    .simple-audio-toggle {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      background: #ef233c;
      border: 2px solid #ff6b7d;
      border-radius: 50%;
      color: #ffffff;
      cursor: pointer;
      transition: transform 0.16s ease, background-color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      box-shadow: 0 0 18px rgba(239, 35, 60, 0.55);
    }

    .simple-audio-toggle:hover {
      transform: scale(1.08);
      box-shadow: 0 0 24px rgba(239, 35, 60, 0.8);
    }

    .simple-audio-toggle.active {
      background: #16c75e;
      border-color: #7bf5a8;
      box-shadow: 0 0 22px rgba(22, 199, 94, 0.65);
    }

    .simple-audio-toggle.active:hover {
      box-shadow: 0 0 28px rgba(22, 199, 94, 0.9);
    }

    .audio-icon-svg {
      width: 24px;
      height: 24px;
      display: block;
    }

    .simple-audio-toggle .icon-waves {
      display: none;
    }

    .simple-audio-toggle .icon-muted {
      display: inline;
    }

    .simple-audio-toggle.active .icon-waves {
      display: inline;
    }

    .simple-audio-toggle.active .icon-muted {
      display: none;
    }

    /* =====================================================
       BOTTOM BOX WITHIN THE MAIN COUNTDOWN:
       4-Panel Style Counter (Days, Hours, Minutes, Seconds)
       ===================================================== */
    .main-bottom-counter-box {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 22px 22px 24px;
      background: radial-gradient(circle at 50% 20%, rgba(0, 240, 255, 0.14), rgba(8, 2, 20, 0.95) 78%);
      border: 2px solid rgba(0, 240, 255, 0.5);
      clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
      box-shadow:
        inset 0 0 36px rgba(0, 240, 255, 0.14),
        0 0 34px rgba(0, 240, 255, 0.18);
    }

    .inner-target-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(0, 240, 255, 0.28);
    }

    .inner-target-title {
      font-size: clamp(0.95rem, 1.8vw, 1.3rem);
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--vice-white);
      text-shadow: 0 0 14px rgba(255, 30, 142, 0.65);
    }

    .inner-target-title span {
      color: var(--vice-gold);
    }

    .inner-target-badge {
      font-family: 'JetBrains Mono', 'Consolas', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: var(--vice-cyan);
      text-transform: uppercase;
    }

    /* 4-Panel Counter Grid Inside the Bottom Box */
    .four-panel-counter-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .counter-panel {
      position: relative;
      background: linear-gradient(165deg, rgba(31, 9, 60, 0.95) 0%, rgba(10, 3, 24, 0.98) 65%, rgba(24, 6, 46, 0.96) 100%);
      border: 1px solid rgba(255, 94, 91, 0.52);
      padding: 20px 14px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
      box-shadow:
        0 18px 42px rgba(0, 0, 0, 0.8),
        inset 0 0 32px rgba(255, 30, 142, 0.14);
      transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
      overflow: hidden;
    }

    .counter-panel:hover {
      transform: translateY(-3px);
      border-color: var(--vice-cyan);
      box-shadow:
        0 22px 50px rgba(0, 0, 0, 0.88),
        0 0 28px rgba(0, 240, 255, 0.28),
        inset 0 0 36px rgba(255, 30, 142, 0.22);
    }

    .counter-panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--vice-pink), var(--vice-orange), var(--vice-gold));
    }

    .counter-panel[data-unit="seconds"]::before {
      background: linear-gradient(90deg, var(--vice-cyan), var(--vice-pink), var(--vice-gold));
    }

    .digit-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 6px 0 10px;
    }

    .digit-ghost {
      position: absolute;
      font-family: 'JetBrains Mono', 'Impact', monospace;
      font-size: clamp(3.8rem, 8.2vw, 7.2rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.03em;
      color: rgba(255, 30, 142, 0.06);
      user-select: none;
      pointer-events: none;
      font-variant-numeric: tabular-nums;
    }

    .digit-value {
      position: relative;
      z-index: 1;
      font-family: 'JetBrains Mono', 'Impact', 'Rajdhani', monospace;
      font-size: clamp(3.8rem, 8.2vw, 7.2rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(180deg, #ffffff 0%, #fff0f7 32%, #ff99cc 68%, #ff2a85 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 26px rgba(255, 30, 142, 0.6));
      transition: transform 0.15s cubic-bezier(0.22, 1, 0.36, 1), filter 0.15s ease;
    }

    .counter-panel[data-unit="hours"] .digit-value {
      background: linear-gradient(180deg, #ffffff 0%, #fff3e0 32%, #ffb067 68%, #ff5e5b 100%);
      -webkit-background-clip: text;
      background-clip: text;
      filter: drop-shadow(0 0 26px rgba(255, 94, 91, 0.6));
    }

    .counter-panel[data-unit="minutes"] .digit-value {
      background: linear-gradient(180deg, #ffffff 0%, #fff9db 32%, #ffd166 68%, #ff8a2b 100%);
      -webkit-background-clip: text;
      background-clip: text;
      filter: drop-shadow(0 0 26px rgba(255, 196, 61, 0.6));
    }

    .counter-panel[data-unit="seconds"] .digit-value {
      background: linear-gradient(180deg, #ffffff 0%, #e0fcff 35%, #5ce1e6 72%, #00f0ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      filter: drop-shadow(0 0 28px rgba(0, 240, 255, 0.72));
    }

    .digit-step-pulse {
      transform: scale(1.06);
      filter: drop-shadow(0 0 34px rgba(0, 240, 255, 0.95)) !important;
    }

    .unit-name-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .unit-label {
      font-size: clamp(1rem, 1.9vw, 1.4rem);
      font-weight: 900;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--vice-white);
    }

    .unit-progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      margin-top: 8px;
      overflow: hidden;
      position: relative;
    }

    .unit-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--vice-pink), var(--vice-orange), var(--vice-gold), var(--vice-cyan));
      box-shadow: 0 0 12px var(--vice-pink);
      transition: width 0.25s linear;
    }

    /* =====================================================
       SUB-SECOND PULSE STRIP
       ===================================================== */
    .subsecond-strip {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 18px;
      background: rgba(12, 4, 28, 0.9);
      border: 1px solid rgba(0, 240, 255, 0.38);
      font-family: 'JetBrains Mono', 'Consolas', monospace;
      font-size: 12px;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.12);
    }

    .subsecond-label {
      color: var(--vice-cyan);
      letter-spacing: 0.18em;
      font-weight: 700;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .subsecond-bar-outer {
      flex: 1;
      height: 7px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      position: relative;
    }

    .subsecond-bar-inner {
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, var(--vice-pink), var(--vice-gold), var(--vice-cyan));
    }

    .subsecond-readout {
      color: var(--vice-gold);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      min-width: 74px;
      text-align: right;
    }

    /* =====================================================
       TWO LARGE SQUARE SOUND EFFECT BUTTONS
       (Between Sub-Second Pulse and Copyright Footer)
       ===================================================== */
    .sfx-buttons-deck {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      width: 100%;
    }

    .sfx-square-btn {
      appearance: none;
      position: relative;
      width: 100%;
      min-height: 230px;
      padding: 24px 20px 20px;
      background: linear-gradient(145deg, rgba(28, 8, 56, 0.94) 0%, rgba(10, 3, 24, 0.98) 60%, rgba(22, 6, 44, 0.95) 100%);
      border: 2px solid rgba(255, 30, 142, 0.58);
      clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 22px 100%, 0 calc(100% - 22px));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      cursor: pointer;
      user-select: none;
      overflow: hidden;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.82),
        0 0 32px rgba(255, 30, 142, 0.2),
        inset 0 0 35px rgba(255, 30, 142, 0.14);
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .sfx-square-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--vice-pink), var(--vice-orange), var(--vice-gold), var(--vice-cyan));
    }

    .sfx-square-btn.money-btn {
      border-color: rgba(46, 242, 122, 0.55);
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.82),
        0 0 32px rgba(46, 242, 122, 0.18),
        inset 0 0 35px rgba(46, 242, 122, 0.12);
    }

    .sfx-square-btn.money-btn::before {
      background: linear-gradient(90deg, #2ef27a, var(--vice-gold), var(--vice-cyan), var(--vice-pink));
    }

    .sfx-square-btn:hover {
      transform: translateY(-4px) scale(1.01);
      border-color: var(--vice-cyan);
      box-shadow:
        0 26px 60px rgba(0, 0, 0, 0.9),
        0 0 42px rgba(0, 240, 255, 0.4),
        inset 0 0 45px rgba(255, 30, 142, 0.24);
    }

    .sfx-square-btn.money-btn:hover {
      border-color: #2ef27a;
      box-shadow:
        0 26px 60px rgba(0, 0, 0, 0.9),
        0 0 42px rgba(46, 242, 122, 0.45),
        inset 0 0 45px rgba(255, 196, 61, 0.24);
    }

    .sfx-square-btn:active {
      transform: scale(0.97);
    }

    /* Active Firing / Cash Animation States */
    .sfx-square-btn.firing-recoil {
      animation: gun-recoil 0.28s ease-out;
      border-color: var(--vice-gold) !important;
      box-shadow:
        0 0 60px rgba(255, 138, 43, 0.75),
        inset 0 0 55px rgba(255, 30, 142, 0.45) !important;
    }

    @keyframes gun-recoil {
      0% { transform: translate(0, 0) scale(1); }
      20% { transform: translate(-5px, 3px) rotate(-1.2deg) scale(0.97); }
      45% { transform: translate(4px, -3px) rotate(1deg) scale(1.02); }
      70% { transform: translate(-3px, 2px) rotate(-0.6deg) scale(0.99); }
      100% { transform: translate(0, 0) scale(1); }
    }

    .sfx-square-btn.cash-pop {
      animation: money-bounce 0.42s cubic-bezier(0.22, 1, 0.36, 1);
      border-color: var(--vice-gold) !important;
      box-shadow:
        0 0 65px rgba(46, 242, 122, 0.75),
        inset 0 0 55px rgba(255, 196, 61, 0.4) !important;
    }

    @keyframes money-bounce {
      0% { transform: scale(1); }
      30% { transform: scale(1.05) translateY(-6px); }
      60% { transform: scale(0.98) translateY(2px); }
      100% { transform: scale(1) translateY(0); }
    }

    .sfx-icon-svg {
      width: clamp(150px, 24vw, 250px);
      height: clamp(105px, 16vw, 155px);
      overflow: visible;
      filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.7));
      transition: transform 0.2s ease;
    }

    .sfx-square-btn:hover .sfx-icon-svg {
      transform: scale(1.05);
    }

    .muzzle-flash-group {
      opacity: 0;
      transform-origin: 278px 58px;
      transition: opacity 0.05s ease;
    }

    .sfx-square-btn.firing-recoil .muzzle-flash-group {
      opacity: 1;
      animation: flash-flicker 0.26s steps(2, end);
    }

    @keyframes flash-flicker {
      0%, 100% { opacity: 1; transform: scale(1.1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }

    .cash-sparkle-group {
      opacity: 0.75;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    .sfx-square-btn.cash-pop .cash-sparkle-group {
      opacity: 1;
      transform: translateY(-8px) scale(1.08);
    }

    .sfx-btn-caption {
      font-family: 'Orbitron', 'Rajdhani', 'Impact', sans-serif;
      font-size: clamp(0.95rem, 1.6vw, 1.25rem);
      font-weight: 900;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--vice-white);
      text-shadow: 0 0 14px rgba(255, 30, 142, 0.65);
    }

    .money-btn .sfx-btn-caption {
      text-shadow: 0 0 14px rgba(46, 242, 122, 0.65);
    }

    /* =====================================================
       BOTTOM FOOTER: HUGE COPYRIGHT TEXT CHIEFSTUDIOLABS
       ===================================================== */
    .chief-footer {
      position: relative;
      padding: 40px 32px;
      min-height: 165px;
      background: linear-gradient(180deg, rgba(17, 5, 36, 0.92) 0%, rgba(7, 2, 16, 0.98) 100%);
      border: 2px solid rgba(255, 30, 142, 0.62);
      clip-path: polygon(24px 0, calc(100% - 24px) 0, 100% 24px, 100% 100%, 0 100%, 0 24px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 8px;
      box-shadow:
        0 -14px 55px rgba(255, 30, 142, 0.24),
        inset 0 0 40px rgba(0, 240, 255, 0.12);
    }

    .chief-footer::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 5px;

  <script>
    (function () {
      'use strict';

      // =========================================================================
      // 1. BUILD 60 PRECISION RADIAL TICKS FOR THE FUTURISTIC ANALOG CLOCK
      // =========================================================================
      const ticksGroup = document.getElementById('clock-ticks-group');
      const tickElements = [];
      if (ticksGroup) {
        const svgNS = 'http://www.w3.org/2000/svg';
        for (let i = 0; i < 60; i++) {
          const line = document.createElementNS(svgNS, 'line');
          const isMajor = i % 5 === 0;
          const angle = i * 6;
          line.setAttribute('x1', '60');
          line.setAttribute('y1', isMajor ? '10' : '11.5');
          line.setAttribute('x2', '60');
          line.setAttribute('y2', isMajor ? '16.5' : '14.5');
          line.setAttribute('stroke', isMajor ? '#ff1e8e' : 'rgba(255, 247, 251, 0.32)');
          line.setAttribute('stroke-width', isMajor ? '2' : '1');
          line.setAttribute('transform', 'rotate(' + angle + ' 60 60)');
          ticksGroup.appendChild(line);
          tickElements.push({ el: line, isMajor: isMajor });
        }
      }

      // =========================================================================
      // 2. SHARED WEB AUDIO API ENGINE:
      //    - Simple ON/OFF Clock Tick Toggle
      //    - Assault Rifle Burst Sound Effect
      //    - Classic Ca-Ching & Money Stacks Sound Effect
      // =========================================================================
      let audioCtx = null;
      let tickSoundEnabled = false;
      const tickToggleBtn = document.getElementById('tick-sound-toggle');

      function getAudioContext() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return null;
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function createNoiseBuffer(ctx, durationSec) {
        const sampleRate = ctx.sampleRate;
        const length = Math.max(1, Math.floor(sampleRate * durationSec));
        const buffer = ctx.createBuffer(1, length, sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < length; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        return buffer;
      }

      function playFuturisticTick(isAccentSecond) {
        if (!tickSoundEnabled) return;
        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(isAccentSecond ? 1480 : 1040, now);
          osc.frequency.exponentialRampToValueAtTime(220, now + 0.035);

          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.04);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.045);
        } catch (err) {
          // Ignore audio restrictions if blocked
        }
      }

      if (tickToggleBtn) {
        tickToggleBtn.addEventListener('click', function () {
          tickSoundEnabled = !tickSoundEnabled;
          tickToggleBtn.classList.toggle('active', tickSoundEnabled);
          tickToggleBtn.setAttribute('aria-pressed', String(tickSoundEnabled));
          tickToggleBtn.setAttribute('aria-label', tickSoundEnabled ? 'Audio On' : 'Audio Off');
          tickToggleBtn.setAttribute('title', tickSoundEnabled ? 'Audio On (click to turn off)' : 'Audio Off (click to turn on)');
          if (tickSoundEnabled) {
            playFuturisticTick(true);
          }
        });
      }

      // --- ASSAULT RIFLE 4-ROUND TACTICAL BURST SOUND ---
      function playAssaultRifleBurst() {
        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          const baseNow = ctx.currentTime;
          const shotCount = 4;
          const shotSpacing = 0.072; // ~830 RPM assault rifle cyclic rate
          const noiseBuf = createNoiseBuffer(ctx, 0.14);

          for (let s = 0; s < shotCount; s++) {
            const t = baseNow + s * shotSpacing;

            // 1. Muzzle Blast Noise Transient
            const noiseSrc = ctx.createBufferSource();
            noiseSrc.buffer = noiseBuf;
            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(3600, t);
            filter.frequency.exponentialRampToValueAtTime(280, t + 0.065);

            const noiseGain = ctx.createGain();
            noiseGain.gain.setValueAtTime(0.001, t);
            noiseGain.gain.linearRampToValueAtTime(0.42, t + 0.002);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.07);

            noiseSrc.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(ctx.destination);
            noiseSrc.start(t);
            noiseSrc.stop(t + 0.075);

            // 2. Low-End Propellant Thump
            const punchOsc = ctx.createOscillator();
            const punchGain = ctx.createGain();
            punchOsc.type = 'sawtooth';
            punchOsc.frequency.setValueAtTime(195, t);
            punchOsc.frequency.exponentialRampToValueAtTime(42, t + 0.06);

            punchGain.gain.setValueAtTime(0.32, t);
            punchGain.gain.exponentialRampToValueAtTime(0.001, t + 0.065);

            punchOsc.connect(punchGain);
            punchGain.connect(ctx.destination);
            punchOsc.start(t);
            punchOsc.stop(t + 0.068);

            // 3. Metallic Bolt Carrier Click
            const boltOsc = ctx.createOscillator();
            const boltGain = ctx.createGain();
            boltOsc.type = 'square';
            boltOsc.frequency.setValueAtTime(2450, t + 0.025);
            boltOsc.frequency.exponentialRampToValueAtTime(980, t + 0.042);

            boltGain.gain.setValueAtTime(0.08, t + 0.025);
            boltGain.gain.exponentialRampToValueAtTime(0.001, t + 0.045);

            boltOsc.connect(boltGain);
            boltGain.connect(ctx.destination);
            boltOsc.start(t + 0.025);
            boltOsc.stop(t + 0.046);
          }

          // Brass Shell Casing Clink after burst
          const shellTime = baseNow + shotCount * shotSpacing + 0.04;
          const shellOsc = ctx.createOscillator();
          const shellGain = ctx.createGain();
          shellOsc.type = 'sine';
          shellOsc.frequency.setValueAtTime(4850, shellTime);
          shellOsc.frequency.exponentialRampToValueAtTime(5200, shellTime + 0.06);
          shellGain.gain.setValueAtTime(0.06, shellTime);
          shellGain.gain.exponentialRampToValueAtTime(0.0005, shellTime + 0.07);
          shellOsc.connect(shellGain);
          shellGain.connect(ctx.destination);
          shellOsc.start(shellTime);
          shellOsc.stop(shellTime + 0.075);
        } catch (err) {
          // Ignore if audio blocked
        }
      }

      // --- COUPLE OF CA-CHINGS & MONEY STACKS SOUNDS ---
      function playCaChingSequence() {
        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          const baseNow = ctx.currentTime;
          const rustleBuf = createNoiseBuffer(ctx, 0.06);

          function triggerSingleCaChing(startTime, pitchScale) {
            // "CA-" Mechanical Cash Drawer Latch Clack
            const clackSrc = ctx.createBufferSource();
            clackSrc.buffer = rustleBuf;
            const bp = ctx.createBiquadFilter();
            bp.type = 'bandpass';
            bp.frequency.setValueAtTime(1350 * pitchScale, startTime);
            bp.Q.setValueAtTime(2.5, startTime);

            const clackGain = ctx.createGain();
            clackGain.gain.setValueAtTime(0.24, startTime);
            clackGain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.045);

            clackSrc.connect(bp);
            bp.connect(clackGain);
            clackGain.connect(ctx.destination);
            clackSrc.start(startTime);
            clackSrc.stop(startTime + 0.05);

            const latchOsc = ctx.createOscillator();
            const latchGain = ctx.createGain();
            latchOsc.type = 'triangle';
            latchOsc.frequency.setValueAtTime(520 * pitchScale, startTime);
            latchOsc.frequency.exponentialRampToValueAtTime(880 * pitchScale, startTime + 0.04);
            latchGain.gain.setValueAtTime(0.18, startTime);
            latchGain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.045);
            latchOsc.connect(latchGain);
            latchGain.connect(ctx.destination);
            latchOsc.start(startTime);
            latchOsc.stop(startTime + 0.05);

            // "-CHING!" Classic Cash Register Bell Ring
            const bellTime = startTime + 0.065;
            const bellFreqs = [2093, 2637, 3136, 4186, 5580];
            for (let i = 0; i < bellFreqs.length; i++) {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(bellFreqs[i] * pitchScale, bellTime);

              const peak = i === 0 ? 0.16 : 0.11 / (i + 0.5);
              const ringDur = 0.34 - i * 0.035;
              gain.gain.setValueAtTime(0.001, bellTime);
              gain.gain.linearRampToValueAtTime(peak, bellTime + 0.004);
              gain.gain.exponentialRampToValueAtTime(0.0005, bellTime + ringDur);

              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(bellTime);
              osc.stop(bellTime + ringDur + 0.01);
            }
          }

          // 1st Ca-Ching!
          triggerSingleCaChing(baseNow, 1.0);

          // Crisp Paper Money Bills Riffle / Coin Cascade in between
          for (let m = 0; m < 4; m++) {
            const flipTime = baseNow + 0.21 + m * 0.038;
            const flipSrc = ctx.createBufferSource();
            flipSrc.buffer = rustleBuf;
            const hp = ctx.createBiquadFilter();
            hp.type = 'highpass';
            hp.frequency.setValueAtTime(2800 + m * 400, flipTime);

            const flipGain = ctx.createGain();
            flipGain.gain.setValueAtTime(0.14, flipTime);
            flipGain.gain.exponentialRampToValueAtTime(0.001, flipTime + 0.028);

            flipSrc.connect(hp);
            hp.connect(flipGain);
            flipGain.connect(ctx.destination);
            flipSrc.start(flipTime);
            flipSrc.stop(flipTime + 0.032);
          }

          // 2nd Higher-Pitched Ca-Ching!
          triggerSingleCaChing(baseNow + 0.38, 1.12);
        } catch (err) {
          // Ignore if audio blocked
        }
      }

      const btnAssaultRifle = document.getElementById('btn-assault-rifle');
      const btnMoneyStacks = document.getElementById('btn-money-stacks');

      if (btnAssaultRifle) {
        btnAssaultRifle.addEventListener('click', function () {
          playAssaultRifleBurst();
          btnAssaultRifle.classList.remove('firing-recoil');
          void btnAssaultRifle.offsetWidth;
          btnAssaultRifle.classList.add('firing-recoil');
          setTimeout(function () {
            btnAssaultRifle.classList.remove('firing-recoil');
          }, 300);
        });
      }

      if (btnMoneyStacks) {
        btnMoneyStacks.addEventListener('click', function () {
          playCaChingSequence();
          btnMoneyStacks.classList.remove('cash-pop');
          void btnMoneyStacks.offsetWidth;
          btnMoneyStacks.classList.add('cash-pop');
          setTimeout(function () {
            btnMoneyStacks.classList.remove('cash-pop');
          }, 440);
        });
      }

      // =========================================================================
      // 3. TARGET TIMESTAMP RESOLUTION: 00:00:00 GMT THURSDAY 19 NOVEMBER
      //    (Midnight: last thing Wednesday night / first thing Thursday morning)
      // =========================================================================
      const PRIMARY_TARGET_UTC = Date.UTC(2026, 10, 19, 0, 0, 0);

      function resolveTargetTimestamp(nowMs) {
        if (nowMs <= PRIMARY_TARGET_UTC + 12 * 3600 * 1000) {
          return PRIMARY_TARGET_UTC;
        }
        const d = new Date(nowMs);
        let year = d.getUTCFullYear();
        let candidate = Date.UTC(year, 10, 19, 0, 0, 0);
        if (nowMs > candidate) {
          candidate = Date.UTC(year + 1, 10, 19, 0, 0, 0);
        }
        return candidate;
      }

      // DOM References
      const elDays = document.getElementById('countdown-days');
      const elHours = document.getElementById('countdown-hours');
      const elMinutes = document.getElementById('countdown-minutes');
      const elSeconds = document.getElementById('countdown-seconds');

      const barDays = document.getElementById('days-bar');
      const barHours = document.getElementById('hours-bar');
      const barMinutes = document.getElementById('minutes-bar');
      const barSeconds = document.getElementById('seconds-bar');

      const barSubsecond = document.getElementById('subsecond-bar');
      const txtSubsecondMs = document.getElementById('subsecond-ms-text');
      const targetStatusBadge = document.getElementById('target-status-badge');

      const handHour = document.getElementById('clock-hour-hand');
      const handMinute = document.getElementById('clock-minute-hand');
      const handSecond = document.getElementById('clock-second-hand');
      const arcSubsecond = document.getElementById('clock-subsecond-arc');
      const ringTelemetry = document.getElementById('clock-telemetry-ring');

      let lastSecondSeen = -1;
      let prevValues = { days: '', hours: '', minutes: '', seconds: '' };

      function pad2(n) {
        return String(n).padStart(2, '0');
      }

      function pad3(n) {
        return String(n).padStart(3, '0');
      }

      function triggerDigitPulse(el) {
        if (!el) return;
        el.classList.add('digit-step-pulse');
        setTimeout(function () {
          el.classList.remove('digit-step-pulse');
        }, 160);
      }

      function updateChronoSystem() {
        const nowMs = Date.now();
        const nowDate = new Date(nowMs);

        // --- A. UPDATE LIVE TICKING CLOCK BESIDE GTAVI TITLE ---
        const utcHours = nowDate.getUTCHours();
        const utcMinutes = nowDate.getUTCMinutes();
        const utcSeconds = nowDate.getUTCSeconds();
        const utcMillis = nowDate.getUTCMilliseconds();

        const secondAngle = utcSeconds * 6;
        const minuteAngle = utcMinutes * 6 + utcSeconds * 0.1;
        const hourAngle = (utcHours % 12) * 30 + utcMinutes * 0.5;

        if (handHour) handHour.setAttribute('transform', 'rotate(' + hourAngle.toFixed(2) + ' 60 60)');
        if (handMinute) handMinute.setAttribute('transform', 'rotate(' + minuteAngle.toFixed(2) + ' 60 60)');
        if (handSecond) handSecond.setAttribute('transform', 'rotate(' + secondAngle + ' 60 60)');

        if (arcSubsecond) {
          const circumference = 295.3;
          const progress = (utcSeconds + utcMillis / 1000) / 60;
          arcSubsecond.setAttribute('stroke-dashoffset', (circumference * (1 - progress)).toFixed(2));
        }
        if (ringTelemetry) {
          const ringAngle = -((nowMs / 40) % 360);
          ringTelemetry.setAttribute('transform', 'rotate(' + ringAngle.toFixed(1) + ' 60 60)');
        }

        if (utcSeconds !== lastSecondSeen) {
          lastSecondSeen = utcSeconds;
          playFuturisticTick(utcSeconds % 5 === 0);

          for (let i = 0; i < tickElements.length; i++) {
            const item = tickElements[i];
            if (i === utcSeconds) {
              item.el.setAttribute('stroke', '#00f0ff');
              item.el.setAttribute('stroke-width', '2.6');
            } else if (i < utcSeconds) {
              item.el.setAttribute('stroke', item.isMajor ? '#ff1e8e' : 'rgba(255, 138, 43, 0.65)');
              item.el.setAttribute('stroke-width', item.isMajor ? '2' : '1.2');
            } else {
              item.el.setAttribute('stroke', item.isMajor ? 'rgba(255, 30, 142, 0.55)' : 'rgba(255, 247, 251, 0.22)');
              item.el.setAttribute('stroke-width', item.isMajor ? '1.8' : '1');
            }
          }
        }

        // --- B. UPDATE 4-PANEL COUNTDOWN TO 12:00 GMT THURSDAY 19 NOVEMBER ---
        const targetMs = resolveTargetTimestamp(nowMs);
        const diffMs = Math.max(0, targetMs - nowMs);

        const totalSeconds = Math.floor(diffMs / 1000);
        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor((totalSeconds % 86400) / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        const remMillis = Math.floor(diffMs % 1000);

        const strDays = pad2(days);
        const strHours = pad2(hours);
        const strMinutes = pad2(minutes);
        const strSeconds = pad2(seconds);

        if (strDays !== prevValues.days) {
          if (elDays) elDays.textContent = strDays;
          if (prevValues.days !== '') triggerDigitPulse(elDays);
          prevValues.days = strDays;
        }
        if (strHours !== prevValues.hours) {
          if (elHours) elHours.textContent = strHours;
          if (prevValues.hours !== '') triggerDigitPulse(elHours);
          prevValues.hours = strHours;
        }
        if (strMinutes !== prevValues.minutes) {
          if (elMinutes) elMinutes.textContent = strMinutes;
          if (prevValues.minutes !== '') triggerDigitPulse(elMinutes);
          prevValues.minutes = strMinutes;
        }
        if (strSeconds !== prevValues.seconds) {
          if (elSeconds) elSeconds.textContent = strSeconds;
          if (prevValues.seconds !== '') triggerDigitPulse(elSeconds);
          prevValues.seconds = strSeconds;
        }

        const daysFillPct = Math.min(100, Math.max(4, ((days + hours / 24) / 7) * 100));
        const hoursFillPct = ((hours + minutes / 60) / 24) * 100;
        const minutesFillPct = ((minutes + seconds / 60) / 60) * 100;
        const secondsFillPct = ((seconds + remMillis / 1000) / 60) * 100;

        if (barDays) barDays.style.width = daysFillPct.toFixed(1) + '%';
        if (barHours) barHours.style.width = hoursFillPct.toFixed(1) + '%';
        if (barMinutes) barMinutes.style.width = minutesFillPct.toFixed(1) + '%';
        if (barSeconds) barSeconds.style.width = secondsFillPct.toFixed(1) + '%';

        if (barSubsecond) {
          barSubsecond.style.width = ((remMillis / 1000) * 100).toFixed(1) + '%';
        }
        if (txtSubsecondMs) {
          txtSubsecondMs.textContent = pad3(remMillis) + ' MS';
        }

        if (targetStatusBadge) {
          if (diffMs === 0) {
            targetStatusBadge.textContent = 'LAUNCH SEQUENCE COMPLETE // 00:00 GMT REACHED';
          } else {
            const totalHoursLeft = (diffMs / 3600000).toFixed(2);
            targetStatusBadge.textContent = 'T-MINUS ' + totalHoursLeft + ' HRS';
          }
        }
      }

      updateChronoSystem();
      function frameLoop() {
        updateChronoSystem();
        window.requestAnimationFrame(frameLoop);
      }
      window.requestAnimationFrame(frameLoop);
      window.setInterval(updateChronoSystem, 250);

      // =========================================================================
      // 4. FUTURISTIC VICE CITY SYNTH-HORIZON BACKGROUND CANVAS
      // =========================================================================
      const canvas = document.getElementById('vice-canvas');
      if (canvas && canvas.getContext) {
        const ctx = canvas.getContext('2d');
        let width = 0;
        let height = 0;
        let pointerX = 0.5;
        let pointerY = 0.5;

        const particles = [];
        const PARTICLE_COUNT = 42;

        function initParticles() {
          particles.length = 0;
          for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push({
              x: Math.random(),
              y: Math.random(),
              r: 1 + Math.random() * 2.2,
              vy: -0.00018 - Math.random() * 0.00035,
              vx: (Math.random() - 0.5) * 0.0002,
              hueType: i % 3
            });
          }
        }

        function resizeCanvas() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          width = window.innerWidth || document.documentElement.clientWidth || 1024;
          height = window.innerHeight || document.documentElement.clientHeight || document.body.scrollHeight || 680;
          canvas.width = Math.max(1, Math.floor(width * dpr));
          canvas.height = Math.max(1, Math.floor(height * dpr));
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('pointermove', function (e) {
          if (width > 0 && height > 0) {
            pointerX = e.clientX / width;
            pointerY = e.clientY / height;
          }
        });

        initParticles();
        resizeCanvas();

        function renderBackdrop(t) {
          const time = t * 0.001;
          ctx.clearRect(0, 0, width, height);

          const sunX = width * (0.5 + (pointerX - 0.5) * 0.06);
          const sunY = height * (0.48 + (pointerY - 0.5) * 0.04);
          const sunRadius = Math.min(width, height) * 0.36;

          const glowGrad = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, sunRadius * 1.9);
          glowGrad.addColorStop(0, 'rgba(255, 30, 142, 0.24)');
          glowGrad.addColorStop(0.38, 'rgba(255, 94, 91, 0.14)');
          glowGrad.addColorStop(0.68, 'rgba(0, 240, 255, 0.07)');
          glowGrad.addColorStop(1, 'rgba(6, 2, 15, 0)');
          ctx.fillStyle = glowGrad;
          ctx.fillRect(0, 0, width, height);

          for (let w = 0; w < 3; w++) {
            ctx.beginPath();
            const baseY = height * (0.62 + w * 0.11);
            for (let x = 0; x <= width; x += 24) {
              const nx = x / width;
              const waveY =
                baseY +
                Math.sin(nx * 5.5 + time * (1.1 + w * 0.3) + w) * (14 + w * 6) +
                Math.cos(nx * 9.0 - time * 0.8) * 6;
              if (x === 0) {
                ctx.moveTo(x, waveY);
              } else {
                ctx.lineTo(x, waveY);
              }
            }
            ctx.strokeStyle =
              w === 0
                ? 'rgba(255, 30, 142, 0.22)'
                : w === 1
                ? 'rgba(255, 196, 61, 0.16)'
                : 'rgba(0, 240, 255, 0.20)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }

          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            if (p.y < -0.05) p.y = 1.05;
            if (p.x < -0.05) p.x = 1.05;
            if (p.x > 1.05) p.x = -0.05;

            const px = p.x * width;
            const py = p.y * height;

            ctx.beginPath();
            ctx.arc(px, py, p.r, 0, Math.PI * 2);
            ctx.fillStyle =
              p.hueType === 0
                ? 'rgba(255, 30, 142, 0.55)'
                : p.hueType === 1
                ? 'rgba(0, 240, 255, 0.55)'
                : 'rgba(255, 196, 61, 0.55)';
            ctx.fill();
          }

          window.requestAnimationFrame(renderBackdrop);
        }

        window.requestAnimationFrame(renderBackdrop);
      }
    })();
  </script>
</body>
</html>
